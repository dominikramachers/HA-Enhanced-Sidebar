name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component
      # Die Integration hängt vom frontend ab, dessen Paket (hass_frontend) nicht mitinstalliert wird.
      - name: Install the frontend package pinned by Home Assistant
        run: |
          pip install "$(python - <<'EOF'
          import json, pathlib, homeassistant
          manifest = pathlib.Path(homeassistant.__file__).parent / "components/frontend/manifest.json"
          print(next(r for r in json.loads(manifest.read_text())["requirements"] if "frontend" in r))
          EOF
          )"
      - run: pytest tests -q
